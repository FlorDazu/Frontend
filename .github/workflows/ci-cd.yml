# ============================================================================
# AYNI · Frontend — CI/CD con GitHub Actions + Render
#
#  push → main:
#    build-and-test : Node 24 → npm ci --include=dev → tests (si existen)
#                     → npm run build (producción, environment.prod.ts)
#    deploy         : solo si el job anterior pasa en verde, dispara el
#                     Deploy Hook de Render (secreto HOOK_RENDER_FRONTEND).
#
# No se suben artefactos dist/: Render vuelve a compilar con render.yaml.
# Requisito: Auto-Deploy en OFF en Render (render.yaml → autoDeploy: false).
# ============================================================================
name: CI/CD Frontend

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build y tests
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Instalar dependencias
        run: npm ci --include=dev

      - name: Ejecutar tests (si hay un script "test" en package.json)
        run: npm test --if-present

      - name: Compilar para producción
        run: npm run build

  deploy:
    name: Trigger Render deploy
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: deploy-render-frontend
      cancel-in-progress: false
    steps:
      - name: Call Render deploy hook
        env:
          HOOK_RENDER_FRONTEND: ${{ secrets.HOOK_RENDER_FRONTEND }}
        run: |
          test -n "$HOOK_RENDER_FRONTEND" || { echo "::error::Falta el secreto HOOK_RENDER_FRONTEND en Settings → Secrets and variables → Actions."; exit 1; }
          curl --fail-with-body --silent --show-error --request POST "$HOOK_RENDER_FRONTEND"
          echo
          echo "Despliegue solicitado a Render: https://frontend-qwpp.onrender.com"
