# ============================================================================
# AYNI · Frontend (Angular 22) en Render — Web Service, plan gratuito
#
# Build:  instala dependencias (incluidas las de desarrollo: Angular CLI y
#         @angular/build son necesarias para compilar) y genera
#         dist/frontend/browser con environment.prod.ts.
# Start:  server.mjs (Node nativo, sin dependencias) sirve los estáticos con
#         fallback de SPA. Consumo ≈ 50 MB de RAM (límite del plan: 512 MB).
#
# URL pública: https://frontend-qwpp.onrender.com
# Deploy: lo dispara GitHub Actions (.github/workflows/ci-cd.yml) con el
#         Deploy Hook; por eso autoDeploy está en false.
# CORS:   el servicio del BACKEND debe tener
#         CORS_ORIGINS=https://frontend-qwpp.onrender.com   (sin "/" final)
# ============================================================================
services:
  - type: web
    name: ayni-frontend
    runtime: node
    plan: free
    branch: main
    autoDeploy: false
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node server.mjs
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "24"
